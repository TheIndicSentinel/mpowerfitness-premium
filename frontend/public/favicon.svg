<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#0b0d0a"/>
  <!-- MP letters — Archivo 900 approximated with geometric strokes -->
  <!-- M glyph: two vertical strokes + V middle -->
  <rect x="2" y="6" width="3" height="20" fill="#c8ee44"/>
  <polygon points="5,6 8.5,16 12,6" fill="#c8ee44"/>
  <rect x="9" y="6" width="3" height="20" fill="#c8ee44"/>
  <!-- P glyph: vertical stroke + rounded top -->
  <rect x="14" y="6" width="3" height="20" fill="#c8ee44"/>
  <path d="M17 6 Q27 6 27 11 Q27 16 17 16 Z" fill="#c8ee44"/>
  <!-- Orange accent bar -->
  <rect x="23" y="24" width="7" height="3" fill="#e7642b"/>
</svg>
