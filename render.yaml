services:
  # Backend API
  - type: web
    name: mpower-fitness-backend
    env: node
    plan: free # Change to starter/standard for production
    region: singapore # Change to your preferred region (e.g., singapore, ohio, frankfurt)
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mpower-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static
          name: mpower-fitness-frontend
          property: hostURL
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: UPI_ID
        value: payments@mpowerfitness # Update this to your actual UPI ID in Render dashboard
      - key: UPI_NAME
        value: Mpower Fitness

  # Frontend React App (Static Site)
  - type: static
    name: mpower-fitness-frontend
    env: static
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishPath: ./build
    # SPA rewrite — every path falls back to index.html so client-side routes
    # (/login, /register, /programs/:slug, /admin/login …) resolve on refresh
    # and on direct deep links instead of returning a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: mpower-fitness-backend
          property: hostURL
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: mpower-fitness-backend
          property: hostURL

databases:
  - name: mpower-db
    plan: free # Change to starter for production
    region: singapore
